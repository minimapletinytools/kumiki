<!DOCTYPE html>
<html lang="en">
<head>

    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src kigumi://app; style-src kigumi://app; font-src kigumi://app;">
    <title>Quick Pick</title>
    <link rel="stylesheet" href="theme.css">
