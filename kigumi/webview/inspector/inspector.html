<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self';">
    <script src="../shell/panel-bridge.js"></script>
    <title>Kigumi Inspector</title>
    <link rel="stylesheet" href="../vendor/codicon.css">
    <link rel="stylesheet" href="../shell/theme.css">
    <link rel="stylesheet" href="inspector.css">
</head>
<body>
    <header class="inspector-header">
        <nav class="inspector-tabs" role="tablist">
            <button class="inspector-tab is-active" role="tab" data-tab="members">Members <span class="count" id="members-count"></span></button>
            <button class="inspector-tab" role="tab" data-tab="log">Log</button>
        </nav>
        <span class="inspector-view" id="view-title"></span>
        <div class="inspector-tools" data-for="members">
            <label><input type="checkbox" data-option="roughLength"> Rough length</label>
            <label><input type="checkbox" data-option="nominal"> Nominal sizes</label>
            <label><input type="checkbox" data-option="csg"> CSG</label>
            <label><input type="checkbox" data-option="tags"> Tags</label>
        </div>
        <div class="inspector-tools" data-for="log" hidden>
            <input id="log-filter" type="search" placeholder="Filter log" aria-label="Filter log">
            <label><input id="log-follow" type="checkbox" checked> Follow</label>
            <button id="log-clear" class="icon-btn" title="Clear"><span class="codicon codicon-clear-all"></span></button>
        </div>
    </header>
    <section class="inspector-body" data-tab="members">
        <p class="empty" id="members-empty">Open a frame to see its members.</p>
        <table class="members" id="members" hidden>
            <thead>
                <tr>
                    <th>#</th><th>Type</th><th>Name</th>
                    <th data-col="tags">Tags</th>
                    <th id="col-length">Length</th><th id="col-width">Width</th><th id="col-height">Height</th>
                    <th data-col="csg">CSG</th><th data-col="csg">Features</th>
                </tr>
            </thead>
            <tbody id="member-rows"></tbody>
        </table>
    </section>
    <section class="inspector-body" data-tab="log" hidden>
        <pre class="log-lines" id="log-lines" tabindex="0"></pre>
    </section>
    <script src="inspector-app.js"></script>
</body>
</html>
