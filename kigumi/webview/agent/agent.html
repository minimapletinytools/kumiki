<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src data:;">
    <script src="../shell/panel-bridge.js"></script>
    <title>Kigumi Agent</title>
    <link rel="stylesheet" href="../vendor/codicon.css">
    <link rel="stylesheet" href="../shell/theme.css">
    <link rel="stylesheet" href="agent.css">
</head>
<body>
    <div class="agent-panel">
        <header class="agent-header">
            <span class="agent-title"><span class="codicon codicon-sparkle"></span> <span data-i18n="agent.title">Agent</span></span>
            <div class="agent-actions">
                <select id="model-select" class="model-select" title="Model" data-i18n-title="agent.model"></select>
                <button id="btn-history" class="icon-btn" title="Past conversations" data-i18n-title="agent.history"><span class="codicon codicon-history"></span></button>
                <button id="btn-settings" class="icon-btn" title="Agent settings" data-i18n-title="agent.settings" aria-haspopup="true" aria-expanded="false"><span class="codicon codicon-settings-gear"></span></button>
                <button id="btn-clear" class="icon-btn" title="New conversation" data-i18n-title="agent.new"><span class="codicon codicon-add"></span></button>
            </div>
        </header>

        <div id="settings-menu" class="settings-menu" hidden>
            <div class="settings-heading" data-i18n="agent.settings.heading">Before the agent changes something</div>
            <label><input type="radio" name="permission-mode" value="ask"> <span data-i18n="agent.settings.ask">Ask before editing files</span></label>
            <label><input type="radio" name="permission-mode" value="auto"> <span data-i18n="agent.settings.auto">Don't ask: edit files and run frames freely</span></label>
            <div id="always-allowed" class="always-allowed"></div>
            <label class="settings-select"><span data-i18n="agent.settings.outputLimit">Longest step</span>
                <select id="setting-output-limit">
                    <option value="8000" data-i18n="agent.settings.outputLimit.8000">8k tokens</option>
                    <option value="16000" data-i18n="agent.settings.outputLimit.16000">16k tokens</option>
                    <option value="32000" data-i18n="agent.settings.outputLimit.32000">32k tokens</option>
                </select></label>
            <label><input id="setting-startup" type="checkbox"> <span data-i18n="agent.settings.startup">Open the agent when Kigumi starts</span></label>
        </div>
        <div id="history-menu" class="history-menu" hidden>
            <div id="history-list"></div>
        </div>
        <div id="bypass-banner" class="bypass-banner" hidden>Not asking before changes</div>
        <div id="messages" class="agent-messages">
            <div class="agent-welcome" id="welcome">
                <h3 data-i18n="agent.welcome.title">Kigumi Agent</h3>
                <p data-i18n="agent.welcome.body">Ask about the frame you have open, or what you have selected in it. The agent can read and edit your project's files, rebuild views and look at them.</p>
                <div class="suggestions">
                    <button class="suggestion-chip" data-i18n="agent.suggest.selected">What do I have selected?</button>
                    <button class="suggestion-chip" data-i18n="agent.suggest.build">Why didn't this frame build?</button>
                    <button class="suggestion-chip" data-i18n="agent.suggest.screenshot">Take a screenshot and describe the frame</button>
                </div>
            </div>
        </div>
        <footer class="agent-footer">
            <div id="activity" class="activity" hidden>
                <span id="activity-label" data-i18n="agent.activity.thinking">Thinking</span><span class="dots"><i></i><i></i><i></i></span>
            </div>
            <div id="todos" class="todos" hidden></div>
            <div id="mentions" class="mentions" hidden></div>
            <div id="attachments" class="attachments" hidden></div>
            <div class="input-box">
                <textarea id="prompt-input" placeholder="Ask about your frame… (@ for a file, paste an image)" data-i18n-placeholder="agent.placeholder" rows="1"></textarea>
                <button id="plan-toggle" class="plan-toggle" title="Plan mode: the agent looks and proposes, and changes nothing" data-i18n-title="agent.plan.title" aria-pressed="false" data-i18n="agent.plan">Plan</button>
                <button id="send-btn" class="send-btn" title="Send message" data-i18n-title="agent.send"><span class="codicon codicon-send"></span></button>
            </div>
            <div class="footer-row">
                <div id="route-note" class="route-note"></div>
                <div id="context-meter" class="context-meter"></div>
            </div>
        </footer>
    </div>
    <script type="module" src="main.js"></script>
</body>
</html>
