<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:;">
    <script src="../shell/panel-bridge.js"></script>
    <title>Kigumi Agent</title>
    <link rel="stylesheet" href="../vendor/codicon.css">
    <link rel="stylesheet" href="../shell/theme.css">
    <link rel="stylesheet" href="agent.css">
</head>
<body>
    <div class="agent-panel">
        <header class="agent-header">
            <span class="agent-title"><span class="codicon codicon-sparkle"></span> Agent</span>
            <div class="agent-actions">
                <select id="model-select" class="model-select" title="Model"></select>
                <button id="btn-history" class="icon-btn" title="Past conversations"><span class="codicon codicon-history"></span></button>
                <button id="btn-settings" class="icon-btn" title="Agent settings" aria-haspopup="true" aria-expanded="false"><span class="codicon codicon-settings-gear"></span></button>
                <button id="btn-clear" class="icon-btn" title="New conversation"><span class="codicon codicon-add"></span></button>
            </div>
        </header>

        <div id="settings-menu" class="settings-menu" hidden>
            <label><input id="setting-bypass" type="checkbox"> Don't ask before changes</label>
            <div class="settings-hint">The agent edits files and moves views without asking first.</div>
            <label><input id="setting-startup" type="checkbox"> Open the agent when Kigumi starts</label>
        </div>
        <div id="history-menu" class="history-menu" hidden>
            <div id="history-list"></div>
        </div>
        <div id="bypass-banner" class="bypass-banner" hidden>Not asking before changes</div>
        <div id="messages" class="agent-messages">
            <div class="agent-welcome" id="welcome">
                <h3>Kigumi Agent</h3>
                <p>Ask about the frame you have open, or what you have selected in it. The agent can read and edit your project's files, rebuild views and look at them.</p>
                <div class="suggestions">
                    <button class="suggestion-chip">What do I have selected?</button>
                    <button class="suggestion-chip">Why didn't this frame build?</button>
                    <button class="suggestion-chip">Take a screenshot and describe the frame</button>
                </div>
            </div>
        </div>
        <footer class="agent-footer">
            <div id="activity" class="activity" hidden>
                <span id="activity-label">Thinking</span><span class="dots"><i></i><i></i><i></i></span>
            </div>
            <div class="input-box">
                <textarea id="prompt-input" placeholder="Ask about your frame…" rows="1"></textarea>
                <button id="send-btn" class="send-btn" title="Send message"><span class="codicon codicon-send"></span></button>
            </div>
            <div class="footer-row">
                <div id="route-note" class="route-note"></div>
                <div id="context-meter" class="context-meter"></div>
            </div>
        </footer>
    </div>
    <script src="markdown.js"></script>
    <script src="agent-app.js"></script>
</body>
</html>
