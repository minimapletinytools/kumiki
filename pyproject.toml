[project]
name = "kumiki"
version = "0.9.4"
description = "Programmatic CAD library for timber framing, woodworking joinery, and architectural framing in Python"
requires-python = ">=3.10"
license = "MPL-2.0"
authors = [{ name = "minimaple" }]
readme = "README.md"
keywords = [
    "timber",
    "timber-framing",
    "woodworking",
    "carpentry",
    "joinery",
    "japanese-joinery",
    "kigumi",
    "kumiki",
    "cad",
    "parametric",
    "csg",
    "3d",
    "architecture",
    "mortise-and-tenon",
    "dovetail",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Artistic Software",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # Used only for the exact-rational LP backstop in kumiki/assembly.py
    # (_lp_sign_feasible_null_vector); all scalar/matrix/geometry math is
    # plain float + numpy.
    "sympy>=1.12.0",
    "numpy>=1.21.0",
    "trimesh>=4.7.0",
    "lxml>=4.9.0",
    "manifold3d>=3.4.0",
    "networkx>=3.0",
    "typing_extensions>=4.0.0",
]

[project.optional-dependencies]
# Headless PNG rendering (kumiki.kigumi_at_home), RenderBackend.TRIMESH_PYGLET.
# Pinned to pyglet<2 because trimesh's built-in scene viewer does not yet
# support the pyglet 2.x rewrite.
render = ["pyglet>=1.5,<2", "scipy>=1.7.0"]
# Headless PNG rendering, RenderBackend.MATPLOTLIB. Genuinely headless (no
# window/GPU/display dependency anywhere) -- the recommended default.
render-matplotlib = ["matplotlib>=3.5.0"]

[project.urls]
Homepage = "https://kumiki.build"
Documentation = "https://kumiki.build/docs/"
Repository = "https://github.com/minimapletinytools/kumiki"
Issues = "https://github.com/minimapletinytools/kumiki/issues"
Changelog = "https://github.com/minimapletinytools/kumiki/blob/main/CHANGELOG.md"
"Try in Browser" = "https://kumiki.build/try/"
"Download Kigumi" = "https://kumiki.build/install"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kumiki"]

[tool.hatch.build.targets.wheel.force-include]
"patterns" = "kumiki/patterns"
"docs" = "kumiki/docs"
"kumiki/_pattern_index.json" = "kumiki/_pattern_index.json"
# kumiki/_pattern_index.json is generated by `make pattern-index`
# (see tools/build_pattern_index.py) and must be regenerated before
# building a release wheel.

[tool.hatch.build.targets.sdist.force-include]
"patterns" = "patterns"
"docs" = "docs"
"kumiki/_pattern_index.json" = "kumiki/_pattern_index.json"

[tool.pytest.ini_options]
# Pytest configuration
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
markers = [
    "gui: opens a real GUI/OpenGL window (pyglet's trimesh viewer, which has no headless mode). Excluded by default; run with `pytest -m gui` or `make test-gui`.",
]
addopts = "-m 'not gui'"

[dependency-groups]
dev = [
    # The optional renderers too, so type checking and tests see what CI sees.
    "kumiki[render,render-matplotlib]",
    "ty>=0.0.15",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
    "mkdocs-gen-files>=0.6.1",
    "mkdocs-literate-nav>=0.6.3",
    "mkdocs-section-index>=0.3.12",
]

[tool.ty.src]
exclude = ["oldcrap", "fusion360/libs", "kigumi/**", "!kigumi/runner.py", "fusion360", "freecad", "patterns", "hidden_structures", "tools/gen_ref_pages.py"]