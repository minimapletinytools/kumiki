name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - 'kumiki/**'
      - 'mkdocs.yml'
      - 'tools/gen_ref_pages.py'
      - 'pyproject.toml'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:
    inputs:
      staging_ref:
        description: 'Branch, tag or commit to put at /try-staging (main if blank)'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the release tags, for Kigumi in the browser

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install website dependencies
        working-directory: website
        run: npm install

      - name: Build website
        working-directory: website
        # The repo variable KIGUMI_TRY (true/false) puts Kigumi in the browser at /try, and links to it.
        env:
          PUBLIC_KIGUMI_TRY: ${{ vars.KIGUMI_TRY == 'true' && 'true' || 'false' }}
        run: npm run build

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.13

      - name: Cache uv artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            .venv
          key: uv-${{ runner.os }}-py3.13-docs-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-py3.13-docs-

      - name: Build documentation site
        run: make docs SITE_DIR=website/dist/docs

      # Kigumi in the browser (kigumi/hosts/pyodide) at /try, not from main: from the newest of the kigumi
      # releases (kigumi-v*) and the browser-only releases (kigumi-web-*), so a browser release holds
      # until the next full one.
      - name: Build Kigumi in the browser
        if: vars.KIGUMI_TRY == 'true'
        run: |
          TAG=$(git tag --list 'kigumi-v*' 'kigumi-web-*' --sort=-creatordate | head -1)
          echo "Kigumi in the browser from $TAG"
          git worktree add "$RUNNER_TEMP/try" "$TAG"
          (cd "$RUNNER_TEMP/try/kigumi" && npm ci --ignore-scripts)
          (cd "$RUNNER_TEMP/try/kigumi/hosts/pyodide" && npm install && npm run build)
          cp -R "$RUNNER_TEMP/try/kigumi/hosts/pyodide/dist" website/dist/try

      # The same at /try-staging, from a branch to try out (the workflow's staging_ref; main when it
      # runs on a push). Allowed to fail: the site and /try deploy either way.
      - name: Build Kigumi in the browser for staging
        if: vars.KIGUMI_TRY == 'true'
        continue-on-error: true
        env:
          STAGING_REF: ${{ inputs.staging_ref || 'main' }}
        run: |
          REF="$STAGING_REF"
          git rev-parse --verify --quiet "origin/$REF" >/dev/null && REF="origin/$REF"
          echo "Kigumi in the browser for staging from $REF ($(git rev-parse --short "$REF"))"
          git worktree add --detach "$RUNNER_TEMP/staging" "$REF"
          (cd "$RUNNER_TEMP/staging/kigumi" && npm ci --ignore-scripts)
          (cd "$RUNNER_TEMP/staging/kigumi/hosts/pyodide" && npm install && npm run build)
          cp -R "$RUNNER_TEMP/staging/kigumi/hosts/pyodide/dist" website/dist/try-staging
          # Kept out of search results.
          sed -i 's|<head>|<head>\n    <meta name="robots" content="noindex">|' website/dist/try-staging/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
