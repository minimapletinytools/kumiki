name: Kigumi Tests

# The unit tests on every change, and the integration suites on each host (kigumi/test/integration.js):
# on a pull request the core suites and those whose feature it changes (--changed), on a push to main
# or a manual run every one.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: kigumi

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.13

      - name: Cache uv artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            .venv
          key: uv-${{ runner.os }}-py3.13-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-py3.13-

      # The runner tests start runner.py against the repo's .venv.
      - name: Install dependencies
        run: |
          if [ ! -f ../kumiki/_pattern_index.json ]; then
            echo '{"schema_version":1,"entries":{}}' > ../kumiki/_pattern_index.json
          fi
          uv sync --group dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: kigumi/package.json

      - name: Install Node.js dependencies
        run: npm install

      # The agent panel test loads its page in Electron, which needs a display.
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run unit tests
        run: xvfb-run -a npm run test:unit

  # Each host's integration suites: the extension in a real VS Code, the standalone app, and Kigumi
  # in a browser. Each needs a display, so they run under xvfb.
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: [vscode, app, web]

    defaults:
      run:
        working-directory: kigumi

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # The base branch too, to see what a pull request changes.
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.13

      - name: Cache uv artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            .venv
          key: uv-${{ runner.os }}-py3.13-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-py3.13-

      # The views start runner.py against the repo's .venv.
      - name: Install dependencies
        run: |
          if [ ! -f ../kumiki/_pattern_index.json ]; then
            echo '{"schema_version":1,"entries":{}}' > ../kumiki/_pattern_index.json
          fi
          uv sync --group dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: kigumi/package.json

      - name: Install Node.js dependencies
        run: npm install

      - name: Cache the VS Code the tests download
        if: matrix.host == 'vscode'
        uses: actions/cache@v4
        with:
          path: kigumi/.vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('kigumi/package.json') }}
          restore-keys: |
            vscode-test-${{ runner.os }}-

      # Ubuntu's AppArmor stops Electron's sandbox from starting.
      - name: Install a virtual display
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # No GPU here: the views draw with SwiftShader.
      - name: Run the ${{ matrix.host }} integration suites
        run: xvfb-run -a npm run test:int -- ${{ matrix.host }} ${{ github.event_name == 'pull_request' && format('--changed origin/{0}', github.base_ref) || '' }}
        env:
          KIGUMI_SOFTWARE_GL: '1'
          KIGUMI_TEST_ARTIFACTS: ${{ github.workspace }}/kigumi/.artifacts/app

      - name: Keep the test screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kigumi-${{ matrix.host }}-artifacts
          path: |
            kigumi/.artifacts
            kigumi/hosts/pyodide/test-artifacts
          if-no-files-found: ignore
