name: CLA

# Asks each new contributor to sign CLA.md by commenting on their PR, and
# records the signature. See CLA.md for what signing grants.
on:
  issue_comment:
    types: [created]
  # pull_request_target so the check can comment on PRs from forks. It never
  # checks out or runs the PR's code.
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - name: CLA Assistant
        # v2.6.1, pinned by commit: this job has write access.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/minimapletinytools/kumiki/blob/main/CLA.md
          # Signatures live on their own branch, so recording one never
          # commits to main.
          branch: cla-signatures
          path-to-signatures: signatures/version1/cla.json
          allowlist: minimapletinytools,dependabot[bot],github-actions[bot]
          lock-pullrequest-aftermerge: false
